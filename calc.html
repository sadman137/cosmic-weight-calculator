<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cosmic Gravity Jumper</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!-- Canvas for interactive stars background -->
        <canvas id="starsCanvas"></canvas>

        <header>
            <h1>Cosmic Gravity Jumper</h1>
            <p>Type your weight, pick a unit, and jump across the Universe!</p>
        </header>

        <!-- Top Section: Controls and Earth -->
        <section class="top-container">
            <div class="calculator-card">
                <label for="earthWeight">Your Weight:</label>
                <div class="input-group">
                    <input type="number" id="earthWeight" placeholder="e.g. 70" value="70">
                    <select id="unitSelect">
                        <option value="kg">kg</option>
                        <option value="lbs">lbs</option>
                    </select>
                </div>
                <button id="calcBtn" onclick="calculateAllWeights()">Calculate</button>
            </div>

            <!-- Earth Display Box -->
            <div class="earth-hero-card planet-item" id="earthHero" onclick="handleEarthClick()">
                <h2>Earth</h2>

                <div class="jumper-container">
                    <img id="jumper-earth" class="astronaut-img" src="assets/ASTRONAUT.png" alt="Astronaut">
                </div>

                <div class="planet-visual-container">
                    <img class="planet-img" src="assets/EARTH.png" alt="EARTH">
                </div>

                <div class="earth-display">
                    <span class="weight-tag" id="earthDisplayWeight">70.0 kg</span>
                    <span class="gravity-tag">1.00 g (9.8 m/s²)</span>
                </div>
            </div>
        </section>

        <!-- Planets Grid Container -->
        <main class="planets-grid" id="planetsGrid">
            <!-- Javascript -->
        </main>

        <script src="script.js"></script>
    </body>
</html>
