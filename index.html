<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Gravity Jumper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

    <!-- Background Stars Canvas -->
    <canvas id="starsCanvas"></canvas>

    <!-- Header Section -->
    <header>
        <h1>COSMIC GRAVITY JUMPER</h1>
        <p>TYPE YOUR WEIGHT, PICK A UNIT, AND JUMP ACROSS THE UNIVERSE</p>
        <p>~ CLICK ON A PLANET TO TEST IT OUT ~</p>
    </header>

    <!-- Top Section Container -->
    <section class="top-container">
        <!-- Weight Input Card -->
        <div class="calculator-card">
            <div class="calculator-card-content">
                <label for="earthWeight">YOUR WEIGHT</label>
                <div class="input-group">
                    <input type="number" id="earthWeight" placeholder="e.g. 70">
                    <select id="unitSelect">
                        <option value="kg">kg</option>
                        <option value="lbs">lbs</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button id="calcBtn" onclick="calculateAllWeights()">CALCULATE</button>
                <button id="shareBtn" class="share-btn">SHARE</button>
            </div>
        </div>

        <!-- Earth Display Card -->
        <div class="earth-hero-card" id="earthHero" onclick="handleEarthClick()">
            <!-- Earth Info Column -->
            <div class="earth-info-column">
                <h2>EARTH</h2>
                <div class="earth-display">
                    <span class="weight-tag" id="earthDisplayWeight">--</span>
                    <span class="gravity-tag">9.8 m/s² (1.00 g)</span>
                </div>
            </div>

            <!-- Earth Visual Column -->
            <div class="earth-visual-column">
                <div class="jumper-container">
                    <img id="jumper-earth" class="astronaut-img" src="assets/ASTRONAUT.png" alt="Astronaut">   
                </div>
                <div class="planet-visual-container-earth">
                    <img class="planet-img earth-img" src="assets/EARTH.png" alt="EARTH">
                </div>
            </div>
        </div>
    </section>

    <!-- Planets Grid Container -->
    <main class="planets-grid" id="planetsGrid"></main>

    <script src="script.js"></script>

    <footer class="site-footer">
        <p>Built with 🚀 for <strong>Hack Club Stardance</strong> by <a href="https://github.com/sadman137" target:"_blank" rel="noopener noreferrer">SADMAN</a></p>
    </footer>
</body>
</html>
